# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger: none

variables:
  mydate: $(Get-Date -Format yyyyMMddhhmmss)

steps:
  - checkout: self
    persistCredentials: true #Important - Persist creds to run further git command
    clean: true

  - task: PowerShell@2
    displayName: 'automated branch from master into a release branch'
    inputs:
      targetType: 'inline'
      script: |
        git fetch;
        git checkout master;
        git checkout -b $('releases/m1'+$(mydate));
        git push --set-upstream origin $('releases/m1'+$(mydate))
