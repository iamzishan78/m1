# Node.js with React
# Build a Node.js project that uses React.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_OPTIONS: --max_old_space_size=32768
  SYSTEM_PULLREQUEST_PULLREQUESTID: $(System.PullRequest.PullRequestId)
  SYSTEM_PULLREQUEST_SOURCEBRANCH: $(System.PullRequest.SourceBranch)
  SYSTEM_PULLREQUEST_TARGETBRANCH: $(System.PullRequest.TargetBranch)
  SYSTEM_PULLREQUEST_TARGETBRANCHNAME: $(System.PullRequest.TargetBranchName)
  SYSTEM_PULLREQUEST_SOURCECOMMITID: $(System.PullRequest.SourceCommitId)
  SYSTEM_PULLREQUEST_SOURCEREPOSITORYURI: $(System.PullRequest.SourceRepositoryURI)
  SYSTEM_PULLREQUEST_PULLREQUESTITERATION: $(System.PullRequest.PullRequestIteration)
  SOURCE_BRANCH: $(Build.SourceBranch)
  BUILD_ID: $(Build.BuildId)
  GIT_PAT: ka6z4ddus6pookbtkg5puclch725bws4ho6arobgrudo4l3qdtnq
  GIT_USER: ahmadfaraz629
  GIT_EMAIL: ahmadfaraz629@gmail.com

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '21.7.3'
    displayName: 'Install Node.js'

  - script: |
      yarn install
    displayName: 'Yarn Install'

  - script: |
      sed -i "s/cypress open/cypress open --env TENENT='$(TENENT)'/" ./package.json
      sed -i "s/login.cy.js'/login.cy.js' --env TENENT='$(TENENT)'/" ./package.json
      sed -i "s/SPEC=\$SPEC/SPEC='\$(SPEC_TYPE)'/" ./package.json
    displayName: 'Replace Tenant & SPEC_TYPE Value'

  - script: |
      # Running script for cypress logging history
      node cypress/scripts/logCypressHistory/index.js
    displayName: 'Run Cypress Logging Script'

  - script: |
      if [ "$(ls -A cypress/screenshots)" ]; then
        echo "Screenshots folder is not empty. Proceeding with the last three steps."
        echo "$(ls -A cypress/screenshots)"
        echo "##vso[task.setvariable variable=SCREENSHOTS_NOT_EMPTY]true"
      else
        echo "Screenshots folder is empty. Skipping the last three steps."
        echo "##vso[task.setvariable variable=SCREENSHOTS_NOT_EMPTY]false"
      fi
    displayName: 'Check Screenshots Folder'
    condition: always() # Always run this script

  ## Copy the client to the staging directory
  - task: CopyFiles@2
    inputs:
      sourceFolder: "cypress"
      contents: |
        screenshots/**/*
        videos/**/*
      targetFolder: "$(Build.ArtifactStagingDirectory)"
      cleanTargetFolder: true
    displayName: 'Copy Screenshots and Videos'
    condition: eq(variables.SCREENSHOTS_NOT_EMPTY, 'true')  # Only run if the Screenshots folder is not empty

  ## Archive the files into a zip file for publishing
  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: $(Build.ArtifactStagingDirectory)
      archiveType: "zip"
      archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
      includeRootFolder: false
    displayName: 'Archive Files'
    condition: eq(variables.SCREENSHOTS_NOT_EMPTY, 'true')  # Only run if the Screenshots folder is not empty

  ## Publish the zip file
  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
    displayName: 'Publish Artifacts'
    condition: eq(variables.SCREENSHOTS_NOT_EMPTY, 'true')  # Only run if the Screenshots folder is not empty